<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <!-- Warm Flame Gradients -->
    <linearGradient id="flame-grad-vert" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="80%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="flame-intense" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="75%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <radialGradient id="optical-lens-glow" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>

    <!-- Obsidian & Slate Shading -->
    <linearGradient id="slate-lit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="slate-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="slate-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="slate-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <filter id="gateway-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <!-- Architectural Radial Watermark -->
    <circle cx="512" cy="512" r="425" fill="none" stroke="#f1f5f9" stroke-width="2" />
    <circle cx="512" cy="512" r="340" fill="none" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="10 8" />

    <g transform="translate(512, 512)" filter="url(#gateway-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="#f8fafc" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <!-- Inner Precision Flame Orbit / Caliper Ring -->
      <polygon points="
        0,-356
        308,-178
        308,178
        0,356
        -308,178
        -308,-178
      " fill="none" stroke="#f97316" stroke-width="4" opacity="0.65" stroke-dasharray="14 10" />

      <!-- Hex Corner Accent Rivets -->
      <circle cx="0" cy="-390" r="7" fill="#f97316" />
      <circle cx="338" cy="-195" r="7" fill="#f97316" />
      <circle cx="338" cy="195" r="7" fill="#f97316" />
      <circle cx="0" cy="390" r="7" fill="#f97316" />
      <circle cx="-338" cy="195" r="7" fill="#f97316" />
      <circle cx="-338" cy="-195" r="7" fill="#f97316" />

      <!-- ======================================================== -->
      <!-- THE FLAME LYNX MASCOT (85% Mass, Symmetrical Low-Poly)    -->
      <!-- ======================================================== -->

      <!-- BASE CHEST / GORGET ARMOR PLATES -->
      <polygon points="0,210 -120,250 -80,345 0,325" fill="url(#slate-shadow)" />
      <polygon points="0,210 120,250 80,345 0,325" fill="url(#slate-deep)" />
      <polygon points="-120,250 -165,220 -140,320 -80,345" fill="url(#slate-deep)" />
      <polygon points="120,250 165,220 140,320 80,345" fill="#020617" />
      
      <!-- Flame Gorget Flanges -->
      <polygon points="0,325 -80,345 0,370" fill="url(#flame-intense)" />
      <polygon points="0,325 80,345 0,370" fill="#c2410c" />

      <!-- Central Lens Prism Diamond -->
      <polygon points="0,235 -38,285 0,330 38,285" fill="url(#flame-intense)" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" />
      <polygon points="0,235 0,330 38,285" fill="#991b1b" opacity="0.4" />
      <circle cx="0" cy="285" r="9" fill="#fef08a" />
      <circle cx="0" cy="285" r="4" fill="#ffffff" />

      <!-- LYNX JAW & CHIN -->
      <polygon points="0,140 -50,130 -65,190 0,210" fill="url(#slate-mid)" />
      <polygon points="0,140 50,130 65,190 0,210" fill="url(#slate-shadow)" />
      <polygon points="-50,130 -125,140 -120,195 -65,190" fill="url(#slate-shadow)" />
      <polygon points="50,130 125,140 120,195 65,190" fill="url(#slate-deep)" />

      <!-- SNOUT / NOSE / MUZZLE -->
      <polygon points="0,65 -30,60 -50,130 0,140" fill="url(#slate-lit)" />
      <polygon points="0,65 30,60 50,130 0,140" fill="url(#slate-mid)" />
      <!-- Flame Nose Tip -->
      <polygon points="0,60 -18,80 0,96 18,80" fill="url(#flame-intense)" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" />
      <polygon points="0,60 0,96 18,80" fill="#b91c1c" opacity="0.4" />

      <!-- NOSE BRIDGE -->
      <polygon points="0,-40 -32,-30 -30,60 0,65" fill="url(#slate-lit)" />
      <polygon points="0,-40 32,-30 30,60 0,65" fill="url(#slate-mid)" />

      <!-- FULL MID-CHEEK COVERAGE (Interlocking Low-Poly Facets) -->
      <!-- Left Mid Cheeks -->
      <polygon points="-85,-10 -150,40 -110,80 -30,60" fill="url(#slate-lit)" />
      <polygon points="-30,60 -110,80 -125,140 -50,130" fill="url(#slate-mid)" />
      <polygon points="-85,-10 -32,-30 -30,60" fill="url(#slate-mid)" />

      <!-- Right Mid Cheeks -->
      <polygon points="85,-10 150,40 110,80 30,60" fill="url(#slate-mid)" />
      <polygon points="30,60 110,80 125,140 50,130" fill="url(#slate-shadow)" />
      <polygon points="85,-10 32,-30 30,60" fill="url(#slate-shadow)" />

      <!-- Full Mid-Cheek Outer Connectors -->
      <polygon points="-150,40 -175,95 -110,80" fill="url(#slate-shadow)" />
      <polygon points="150,40 175,95 110,80" fill="url(#slate-deep)" />

      <!-- LYNX BEARDED CHEEK RUFFS (Side Whiskers) -->
      <!-- Left Cheek Outer Tuft Facets -->
      <polygon points="-85,-10 -155,-50 -235,-20 -150,40" fill="url(#slate-mid)" />
      <polygon points="-150,40 -235,-20 -270,35 -175,95" fill="url(#slate-shadow)" />
      <polygon points="-175,95 -270,35 -245,115 -110,80" fill="url(#slate-shadow)" />
      <polygon points="-110,80 -245,115 -195,175 -125,140" fill="url(#slate-deep)" />
      <polygon points="-125,140 -195,175 -120,195" fill="#020617" />
      <!-- Left Flame Whisker Tips -->
      <polygon points="-235,-20 -280,0 -270,35" fill="url(#flame-grad-vert)" />
      <polygon points="-270,35 -295,75 -245,115" fill="url(#flame-intense)" />

      <!-- Right Cheek Outer Tuft Facets -->
      <polygon points="85,-10 155,-50 235,-20 150,40" fill="url(#slate-shadow)" />
      <polygon points="150,40 235,-20 270,35 175,95" fill="url(#slate-deep)" />
      <polygon points="175,95 270,35 245,115 110,80" fill="url(#slate-deep)" />
      <polygon points="110,80 245,115 195,175 125,140" fill="#020617" />
      <polygon points="125,140 195,175 120,195" fill="#000000" />
      <!-- Right Flame Whisker Tips -->
      <polygon points="235,-20 280,0 270,35" fill="#ea580c" />
      <polygon points="270,35 295,75 245,115" fill="#c2410c" />

      <!-- FOREHEAD & TEMPLE FACETS -->
      <polygon points="0,-175 -75,-190 -65,-95 0,-115" fill="url(#slate-lit)" />
      <polygon points="0,-175 75,-190 65,-95 0,-115" fill="url(#slate-mid)" />
      
      <polygon points="0,-115 -65,-95 -32,-30 0,-40" fill="url(#slate-lit)" />
      <polygon points="0,-115 65,-95 32,-30 0,-40" fill="url(#slate-mid)" />

      <polygon points="-75,-190 -165,-125 -155,-50 -65,-95" fill="url(#slate-mid)" />
      <polygon points="75,-190 165,-125 155,-50 65,-95" fill="url(#slate-shadow)" />

      <!-- Brow Flame Crest -->
      <polygon points="0,-190 -30,-140 0,-100 30,-140" fill="url(#flame-grad-vert)" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" />
      <polygon points="0,-190 0,-100 30,-140" fill="#ea580c" opacity="0.4" />

      <!-- LYNX EARS (Long, Pointed, Triangular with Iconic Black & Flame Tufts) -->
      <!-- Left Ear Outer Base -->
      <polygon points="-75,-190 -165,-125 -165,-305" fill="url(#slate-mid)" />
      <!-- Left Inner Ear Hollow (Warm Flame Glow) -->
      <polygon points="-85,-180 -148,-135 -152,-285" fill="url(#flame-grad-vert)" />
      <polygon points="-115,-160 -148,-135 -152,-285" fill="#dc2626" opacity="0.45" />
      <!-- Left Lynx Ear Tuft (Feathered Spikes Piercing Upward) -->
      <polygon points="-165,-305 -195,-360 -150,-280" fill="#0f172a" />
      <polygon points="-165,-305 -180,-375 -170,-325" fill="url(#flame-intense)" />

      <!-- Right Ear Outer Base -->
      <polygon points="75,-190 165,-125 165,-305" fill="url(#slate-shadow)" />
      <!-- Right Inner Ear Hollow -->
      <polygon points="85,-180 148,-135 152,-285" fill="url(#flame-grad-vert)" />
      <polygon points="115,-160 148,-135 152,-285" fill="#991b1b" opacity="0.5" />
      <!-- Right Lynx Ear Tuft -->
      <polygon points="165,-305 195,-360 150,-280" fill="#020617" />
      <polygon points="165,-305 180,-375 170,-325" fill="url(#flame-intense)" />

      <!-- ======================================================== -->
      <!-- FELINE OPTICAL APERTURE LENSES (Alert, Upward Tilted)     -->
      <!-- ======================================================== -->

      <!-- LEFT EYE SOCKET & OPTICAL APERTURE -->
      <polygon points="-40,-35 -70,-75 -145,-60 -120,-20 -55,-15" fill="#0b0f19" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" />
      <polygon points="-40,-35 -70,-75 -145,-60 -140,-70 -65,-85 -35,-42" fill="url(#flame-intense)" stroke="#0f172a" stroke-width="1.5" />
      
      <!-- Circular Optical Lens Assembly at (-90, -42) -->
      <g transform="translate(-90, -42)">
        <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="#f97316" stroke-width="3.5" />
        <circle cx="0" cy="0" r="19" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 3" />
        <circle cx="0" cy="0" r="15" fill="url(#optical-lens-glow)" />
        <polygon points="0,-12 4,0 0,12 -4,0" fill="#090d16" />
        <circle cx="-4" cy="-5" r="3" fill="#ffffff" />
        <circle cx="3" cy="4" r="1.5" fill="#ffffff" opacity="0.8" />
      </g>

      <!-- RIGHT EYE SOCKET & OPTICAL APERTURE -->
      <polygon points="40,-35 70,-75 145,-60 120,-20 55,-15" fill="#020617" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" />
      <polygon points="40,-35 70,-75 145,-60 140,-70 65,-85 35,-42" fill="url(#flame-intense)" stroke="#0f172a" stroke-width="1.5" />

      <!-- Circular Optical Lens Assembly at (90, -42) -->
      <g transform="translate(90, -42)">
        <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="#f97316" stroke-width="3.5" />
        <circle cx="0" cy="0" r="19" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 3" />
        <circle cx="0" cy="0" r="15" fill="url(#optical-lens-glow)" />
        <polygon points="0,-12 4,0 0,12 -4,0" fill="#090d16" />
        <circle cx="-4" cy="-5" r="3" fill="#ffffff" />
        <circle cx="3" cy="4" r="1.5" fill="#ffffff" opacity="0.8" />
      </g>

      <!-- Structural Origami Seam Lines -->
      <g stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
        <line x1="0" y1="-175" x2="0" y2="-115" />
        <line x1="0" y1="-115" x2="0" y2="-40" />
        <line x1="0" y1="-40" x2="0" y2="65" />
        <line x1="0" y1="65" x2="0" y2="140" />
        <line x1="0" y1="140" x2="0" y2="210" />
      </g>

    </g>
  </g>
</svg>